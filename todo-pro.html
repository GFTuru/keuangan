/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }

<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

<style>
  :root {
    --canvas: oklch(0.975 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --surface-2: oklch(0.955 0.01 75);
    --ink: oklch(0.26 0.02 55);
    --ink-soft: oklch(0.42 0.02 55);
    --muted: oklch(0.58 0.015 60);
    --faint: oklch(0.72 0.012 65);
    --border: oklch(0.9 0.012 70);
    --border-soft: oklch(0.94 0.008 72);
    --accent: oklch(0.58 0.15 42);
    --accent-hover: oklch(0.51 0.15 42);
    --accent-tint: oklch(0.94 0.03 55);
    --accent-tint-2: oklch(0.9 0.05 52);
    --p-high: oklch(0.57 0.19 26);
    --p-high-tint: oklch(0.94 0.04 30);
    --p-med: oklch(0.66 0.14 62);
    --p-med-tint: oklch(0.94 0.05 75);
    --p-low: oklch(0.6 0.08 215);
    --p-low-tint: oklch(0.94 0.03 220);
    --done: oklch(0.62 0.13 150);
    --done-tint: oklch(0.93 0.04 150);
    --loop: oklch(0.56 0.13 285);
    --loop-tint: oklch(0.94 0.04 290);

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 26px;
    --sh-sm: 0 1px 2px oklch(0.4 0.02 55 / 0.06), 0 1px 1px oklch(0.4 0.02 55 / 0.04);
    --sh-md: 0 4px 14px oklch(0.4 0.02 55 / 0.08), 0 2px 5px oklch(0.4 0.02 55 / 0.05);
    --sh-lg: 0 18px 48px oklch(0.35 0.02 55 / 0.16), 0 6px 16px oklch(0.35 0.02 55 / 0.08);

    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
    --z-drawer: 40; --z-modal: 60; --z-toast: 80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    font-optical-sizing: auto;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  h1, h2, h3 { text-wrap: balance; font-weight: 600; }
  ::selection { background: var(--accent-tint-2); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  input, textarea { background: none; border: none; outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ============ APP SHELL ============ */
  .app { display: grid; grid-template-columns: 272px 1fr; height: 100dvh; }

  /* ============ SIDEBAR ============ */
  .side {
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: var(--sp-5) 0;
    overflow-y: auto;
  }
  .brand {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-5) var(--sp-5);
  }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--accent); color: white;
    display: grid; place-items: center; flex-shrink: 0;
    box-shadow: var(--sh-sm);
  }
  .brand-name {
    font-family: "Fraunces", serif; font-size: 1.32rem; font-weight: 600;
    letter-spacing: -0.01em; line-height: 1.1;
  }
  .brand-sub { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

  .side-add {
    margin: 0 var(--sp-4) var(--sp-5); display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: white; padding: 11px; border-radius: var(--r-md);
    font-weight: 600; font-size: 0.92rem; box-shadow: var(--sh-sm);
    transition: background .15s var(--ease-out), transform .1s var(--ease-out);
  }
  .side-add:hover { background: var(--accent-hover); }
  .side-add:active { transform: scale(0.98); }

  .side-section { padding: 0 var(--sp-3); margin-bottom: var(--sp-5); }
  .side-label {
    font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--faint);
    padding: 0 var(--sp-3); margin-bottom: var(--sp-2);
    display: flex; align-items: center; justify-content: space-between;
  }
  .side-label button { color: var(--faint); display: grid; place-items: center; padding: 3px; border-radius: 6px; transition: all .15s var(--ease-out); }
  .side-label button:hover { color: var(--accent); background: var(--accent-tint); }

  .nav-item {
    display: flex; align-items: center; gap: var(--sp-3);
    width: 100%; padding: 9px var(--sp-3); border-radius: var(--r-sm);
    color: var(--ink-soft); font-size: 0.92rem; font-weight: 500;
    transition: background .15s var(--ease-out), color .15s var(--ease-out);
    text-align: left; position: relative;
  }
  .nav-item:hover { background: var(--surface); color: var(--ink); }
  .nav-item.active { background: var(--accent-tint); color: var(--accent-hover); font-weight: 600; }
  .nav-item .ico { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .count {
    font-size: 0.76rem; color: var(--muted); font-weight: 500;
    font-variant-numeric: tabular-nums; min-width: 20px; text-align: right;
  }
  .nav-item.active .count { color: var(--accent-hover); }
  .proj-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin: 0 4px; }
  .proj-del { opacity: 0; color: var(--faint); padding: 2px; border-radius: 5px; transition: opacity .12s; }
  .nav-item:hover .proj-del { opacity: 1; }
  .proj-del:hover { color: var(--p-high); background: var(--p-high-tint); }

  .side-foot { margin-top: auto; padding: var(--sp-4) var(--sp-5) 0; }
  .storage-note { font-size: 0.72rem; color: var(--faint); line-height: 1.4; display: flex; gap: 7px; align-items: flex-start; }

  /* ============ MAIN ============ */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: var(--sp-5) var(--sp-6) var(--sp-4);
    border-bottom: 1px solid var(--border-soft);
    display: flex; flex-direction: column; gap: var(--sp-4);
  }
  .top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); }
  .view-meta { min-width: 0; }
  .view-title {
    font-family: "Fraunces", serif; font-size: clamp(1.6rem, 3vw, 2.15rem);
    font-weight: 600; letter-spacing: -0.015em; line-height: 1.05;
  }
  .view-date { font-size: 0.9rem; color: var(--muted); margin-top: 3px; }

  .progress-wrap { display: flex; align-items: center; gap: var(--sp-4); flex-shrink: 0; }
  .progress-txt { text-align: right; }
  .progress-num { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .progress-lbl { font-size: 0.76rem; color: var(--muted); }
  .ring { --pct: 0; width: 52px; height: 52px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .track { stroke: var(--border); }
  .ring .fill { stroke: var(--done); stroke-dasharray: 138.2; stroke-dashoffset: calc(138.2 - 138.2 * var(--pct)); transition: stroke-dashoffset .6s var(--ease-out); }

  .controls { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .search {
    display: flex; align-items: center; gap: var(--sp-2);
    background: var(--surface-2); border: 1px solid transparent;
    border-radius: var(--r-md); padding: 7px var(--sp-3); flex: 1; min-width: 180px; max-width: 340px;
    transition: border-color .15s, background .15s;
  }
  .search:focus-within { border-color: var(--accent); background: var(--surface); }
  .search .ico { color: var(--muted); width: 16px; height: 16px; flex-shrink: 0; }
  .search input { flex: 1; font-size: 0.9rem; }
  .search input::placeholder { color: var(--faint); }
  .search .clr { color: var(--faint); display: none; padding: 2px; border-radius: 5px; }
  .search.has-val .clr { display: grid; place-items: center; }

  .seg { display: flex; background: var(--surface-2); border-radius: var(--r-md); padding: 3px; }
  .seg button {
    padding: 6px 12px; border-radius: 9px; font-size: 0.83rem; font-weight: 500;
    color: var(--muted); transition: all .15s var(--ease-out); white-space: nowrap;
  }
  .seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--sh-sm); font-weight: 600; }

  .sort {
    display: flex; align-items: center; gap: 6px; padding: 7px 11px;
    background: var(--surface-2); border-radius: var(--r-md);
    font-size: 0.83rem; color: var(--ink-soft); font-weight: 500;
    transition: background .15s;
  }
  .sort:hover { background: var(--border-soft); }
  .sort select { cursor: pointer; font-weight: 500; }
  .icon-btn {
    display: grid; place-items: center; width: 36px; height: 36px;
    border-radius: var(--r-md); background: var(--surface-2); color: var(--ink-soft);
    transition: all .15s var(--ease-out);
  }
  .icon-btn:hover { background: var(--border-soft); color: var(--ink); }
  .menu-btn { display: none; }

  /* ============ LIST ============ */
  .scroll { flex: 1; overflow-y: auto; padding: var(--sp-5) var(--sp-6) var(--sp-8); }
  .group-head {
    display: flex; align-items: center; gap: var(--sp-2);
    font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: var(--sp-5) 0 var(--sp-2); padding: 0 var(--sp-2);
  }
  .group-head:first-child { margin-top: var(--sp-2); }
  .group-head .gcount { color: var(--faint); font-weight: 500; }
  .group-head .line { flex: 1; height: 1px; background: var(--border-soft); }
  .group-head.overdue { color: var(--p-high); }

  .task {
    display: flex; align-items: flex-start; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-3); border-radius: var(--r-md);
    transition: background .14s var(--ease-out);
    position: relative; border: 1px solid transparent;
  }
  .task:hover { background: var(--surface); border-color: var(--border-soft); }
  .task.dragging { opacity: 0.4; }
  .task.drop-above::before, .task.drop-below::after {
    content: ''; position: absolute; left: 40px; right: 8px; height: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .task.drop-above::before { top: -1px; }
  .task.drop-below::after { bottom: -1px; }
  .task.looping .check { animation: spin .5s var(--ease-out); }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .drag-h {
    opacity: 0; color: var(--faint); cursor: grab; padding-top: 3px;
    transition: opacity .12s; touch-action: none; margin-left: -6px;
  }
  .task:hover .drag-h { opacity: 1; }
  .drag-h:active { cursor: grabbing; }

  .check {
    width: 22px; height: 22px; border: 2px solid var(--faint); border-radius: 7px;
    flex-shrink: 0; margin-top: 1px; display: grid; place-items: center;
    transition: all .18s var(--ease-out); color: white; position: relative;
  }
  .check:hover { border-color: var(--done); }
  .check svg { width: 13px; height: 13px; opacity: 0; transform: scale(0.5); transition: all .18s var(--ease-out); }
  .task.done .check { background: var(--done); border-color: var(--done); }
  .task.done .check svg { opacity: 1; transform: scale(1); }
  .check.pri-hi { border-color: var(--p-high); }
  .check.pri-md { border-color: var(--p-med); }
  .check.is-loop { border-radius: 50%; }
  .check.is-loop:hover { border-color: var(--loop); }

  .t-body { flex: 1; min-width: 0; cursor: pointer; }
  .t-title {
    font-size: 0.96rem; color: var(--ink); line-height: 1.4; word-break: break-word;
    transition: color .18s var(--ease-out);
  }
  .task.done .t-title { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--border); }
  .t-meta { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-top: 5px; }
  .t-meta:empty { display: none; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 500;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .badge .ico { width: 13px; height: 13px; }
  .badge.due-over { color: var(--p-high); font-weight: 600; }
  .badge.due-today { color: var(--accent); font-weight: 600; }
  .badge.pri { padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .badge.pri.hi { background: var(--p-high-tint); color: var(--p-high); }
  .badge.pri.md { background: var(--p-med-tint); color: oklch(0.5 0.13 62); }
  .badge.pri.lo { background: var(--p-low-tint); color: var(--p-low); }
  .badge.proj .proj-dot { margin: 0; }
  .badge.tag { color: var(--accent-hover); }
  .badge.loop { color: var(--loop); font-weight: 600; }
  .badge.sub .ico { width: 12px; height: 12px; }

  .t-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .12s; }
  .task:hover .t-actions, .task:focus-within .t-actions { opacity: 1; }
  .t-actions button { color: var(--faint); padding: 6px; border-radius: 7px; display: grid; place-items: center; transition: all .14s var(--ease-out); }
  .t-actions button:hover { color: var(--ink); background: var(--surface-2); }
  .t-actions button.del:hover { color: var(--p-high); background: var(--p-high-tint); }

  /* ============ EMPTY ============ */
  .empty { text-align: center; padding: var(--sp-8) var(--sp-4); max-width: 380px; margin: 0 auto; }
  .empty-art {
    width: 76px; height: 76px; margin: 0 auto var(--sp-4); border-radius: var(--r-xl);
    background: var(--accent-tint); color: var(--accent); display: grid; place-items: center;
  }
  .empty h3 { font-family: "Fraunces", serif; font-size: 1.3rem; margin-bottom: var(--sp-2); font-weight: 500; }
  .empty p { color: var(--muted); font-size: 0.92rem; margin-bottom: var(--sp-4); }
  .empty-cta { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: white; padding: 9px 18px; border-radius: var(--r-md); font-weight: 600; font-size: 0.9rem; transition: background .15s; }
  .empty-cta:hover { background: var(--accent-hover); }

  /* ============ MODAL ============ */
  dialog { border: none; padding: 0; background: none; color: inherit; max-height: 100dvh; }
  dialog::backdrop { background: oklch(0.3 0.02 55 / 0.4); backdrop-filter: blur(2px); }
  dialog[open] { animation: modalIn .3s var(--ease-out); }
  dialog[open]::backdrop { animation: fadeIn .3s var(--ease-out); }
  @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(560px, calc(100vw - 32px)); background: var(--surface);
    border-radius: var(--r-xl); box-shadow: var(--sh-lg); overflow: hidden;
    max-height: calc(100dvh - 48px); display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: flex-start; gap: var(--sp-3);
    padding: var(--sp-5) var(--sp-5) var(--sp-4);
  }
  .modal-head .check { width: 26px; height: 26px; margin-top: 4px; }
  .modal-head .check svg { width: 15px; height: 15px; }
  .modal-head-title { flex: 1; font-family: "Fraunces", serif; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; }
  .m-title {
    flex: 1; font-family: "Fraunces", serif; font-size: 1.35rem; font-weight: 500;
    line-height: 1.25; resize: none; overflow: hidden;
  }
  .m-title.done { color: var(--faint); text-decoration: line-through; }
  .modal-close { color: var(--muted); padding: 6px; border-radius: 8px; transition: all .14s; }
  .modal-close:hover { background: var(--surface-2); color: var(--ink); }

  .modal-body { padding: 0 var(--sp-5); overflow-y: auto; }
  .field { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0; border-top: 1px solid var(--border-soft); }
  .field.top { align-items: flex-start; }
  .field.first { border-top: none; }
  .field-lbl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.88rem; width: 108px; flex-shrink: 0; }
  .field-lbl .ico { width: 16px; height: 16px; }
  .field-ctl { flex: 1; min-width: 0; }
  .field-ctl select, .field-ctl input, .field-ctl textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 0.9rem; background: var(--surface-2); cursor: pointer; transition: border-color .15s;
    font-family: inherit;
  }
  .field-ctl input[type=text] { cursor: text; }
  .field-ctl select:focus, .field-ctl input:focus, .field-ctl textarea:focus { border-color: var(--accent); background: var(--surface); }
  .big-title-input {
    width: 100%; font-size: 1.15rem; padding: 4px 0; font-weight: 500; cursor: text !important;
    border: none !important; background: none !important;
  }
  .m-notes { min-height: 60px; resize: vertical; line-height: 1.55; cursor: text !important; }

  /* ============ LOOP CARD ============ */
  .loop-block { padding: var(--sp-4) 0; border-top: 1px solid var(--border-soft); }
  .loop-toggle-row { display: flex; align-items: center; gap: var(--sp-3); }
  .loop-toggle-row .field-lbl { width: auto; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; margin-left: auto; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background .2s var(--ease-out); }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: white; border-radius: 50%; box-shadow: var(--sh-sm); transition: transform .22s var(--ease-out); }
  .switch input:checked ~ .track { background: var(--loop); }
  .switch input:checked ~ .knob { transform: translateX(18px); }

  .loop-panel { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
  .loop-panel.hide { display: none; }

  .every-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .every-row .lead { font-size: 0.92rem; color: var(--ink-soft); }
  .num-step { display: inline-flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .num-step button { width: 32px; height: 38px; display: grid; place-items: center; color: var(--muted); transition: background .14s, color .14s; }
  .num-step button:hover { background: var(--border-soft); color: var(--ink); }
  .num-step input { width: 52px; text-align: center; font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; border: none; background: none; -moz-appearance: textfield; }
  .num-step input::-webkit-outer-spin-button, .num-step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit-sel { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); font-size: 0.92rem; font-weight: 500; cursor: pointer; }
  .unit-sel:focus { border-color: var(--accent); background: var(--surface); }

  .mode-label { font-size: 0.82rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .mode-opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .mode-card {
    text-align: left; padding: var(--sp-3) var(--sp-4); border: 1.5px solid var(--border); border-radius: var(--r-md);
    background: var(--surface-2); transition: all .16s var(--ease-out); display: flex; flex-direction: column; gap: 3px;
  }
  .mode-card:hover { border-color: var(--faint); }
  .mode-card.sel { border-color: var(--loop); background: var(--loop-tint); }
  .mode-card .mc-top { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.92rem; color: var(--ink); }
  .mode-card .mc-top .ico { width: 15px; height: 15px; color: var(--loop); }
  .mode-card .mc-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
  .loop-preview { font-size: 0.84rem; color: var(--loop); background: var(--loop-tint); padding: 9px 12px; border-radius: var(--r-sm); line-height: 1.45; display: flex; gap: 8px; align-items: flex-start; }
  .loop-preview .ico { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; }
  @media (max-width: 480px) { .mode-opts { grid-template-columns: 1fr; } }

  .subs { padding: var(--sp-4) 0; border-top: 1px solid var(--border-soft); }
  .subs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); }
  .subs-head .field-lbl { width: auto; }
  .subs-bar { height: 5px; background: var(--border-soft); border-radius: 3px; overflow: hidden; flex: 1; margin: 0 var(--sp-3); }
  .subs-bar span { display: block; height: 100%; background: var(--done); border-radius: 3px; transition: width .4s var(--ease-out); }
  .sub-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .sub-check { width: 18px; height: 18px; border: 2px solid var(--faint); border-radius: 5px; flex-shrink: 0; display: grid; place-items: center; color: white; transition: all .16s var(--ease-out); }
  .sub-check svg { width: 11px; height: 11px; opacity: 0; transition: opacity .16s; }
  .sub-item.done .sub-check { background: var(--done); border-color: var(--done); }
  .sub-item.done .sub-check svg { opacity: 1; }
  .sub-item input { flex: 1; font-size: 0.9rem; }
  .sub-item.done input { color: var(--faint); text-decoration: line-through; }
  .sub-item .sub-del { opacity: 0; color: var(--faint); padding: 3px; border-radius: 5px; transition: all .12s; }
  .sub-item:hover .sub-del { opacity: 1; }
  .sub-item .sub-del:hover { color: var(--p-high); }
  .sub-add { display: flex; align-items: center; gap: 10px; padding: 6px 0; color: var(--muted); }
  .sub-add .ico { width: 18px; height: 18px; }
  .sub-add input { flex: 1; font-size: 0.9rem; }

  .modal-foot {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border-soft);
    background: var(--surface-2);
  }
  .m-created { font-size: 0.78rem; color: var(--faint); }
  .btn-del {
    display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-md);
    color: var(--p-high); font-weight: 500; font-size: 0.88rem; transition: background .14s;
  }
  .btn-del:hover { background: var(--p-high-tint); }
  .foot-actions { display: flex; align-items: center; gap: var(--sp-2); }

  /* ============ TOAST ============ */
  .toast-wrap { position: fixed; bottom: var(--sp-5); left: 50%; transform: translateX(-50%); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; }
  .toast {
    display: flex; align-items: center; gap: var(--sp-3); background: var(--ink); color: oklch(0.97 0.01 75);
    padding: 11px var(--sp-3) 11px var(--sp-4); border-radius: var(--r-md); box-shadow: var(--sh-lg);
    font-size: 0.88rem; animation: toastIn .35s var(--ease-out); max-width: 90vw;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .toast button { color: var(--accent-tint-2); font-weight: 600; padding: 4px 10px; border-radius: 7px; transition: background .14s; white-space: nowrap; }
  .toast button:hover { background: oklch(1 0 0 / 0.1); }

  /* ============ DIALOG small ============ */
  .mini-modal { width: min(360px, calc(100vw - 32px)); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-lg); padding: var(--sp-5); }
  .mini-modal h3 { font-family: "Fraunces", serif; font-size: 1.2rem; font-weight: 500; margin-bottom: var(--sp-4); }
  .mini-modal input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); font-size: 0.95rem; background: var(--surface-2); }
  .mini-modal input[type=text]:focus { border-color: var(--accent); background: var(--surface); }
  .swatches { display: flex; gap: 10px; margin: var(--sp-4) 0; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; transition: transform .12s; }
  .swatch:hover { transform: scale(1.12); }
  .swatch.sel { border-color: var(--ink); }
  .mini-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; margin-top: var(--sp-2); }
  .btn { padding: 9px 18px; border-radius: var(--r-md); font-weight: 600; font-size: 0.9rem; transition: all .15s var(--ease-out); }
  .btn-ghost { color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-primary { background: var(--accent); color: white; display: inline-flex; align-items: center; gap: 7px; }
  .btn-primary:hover { background: var(--accent-hover); }

  .scrim { position: fixed; inset: 0; background: oklch(0.3 0.02 55 / 0.4); z-index: var(--z-drawer); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.on { opacity: 1; pointer-events: auto; }

  @keyframes taskFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .task { animation: taskFade .3s var(--ease-out) backwards; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px; z-index: calc(var(--z-drawer) + 1);
      transform: translateX(-100%); transition: transform .32s var(--ease-out); box-shadow: var(--sh-lg);
    }
    .side.open { transform: none; }
    .menu-btn { display: grid; }
    .topbar { padding: var(--sp-4) var(--sp-4) var(--sp-3); }
    .scroll { padding: var(--sp-4) var(--sp-4) var(--sp-8); }
    .controls .sort .slbl { display: none; }
    .search { max-width: none; }
  }
  @media (max-width: 520px) {
    .seg button { padding: 6px 9px; font-size: 0.8rem; }
    .progress-txt { display: none; }
    .t-actions { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const LS = 'tugasPro.v2';

  const PROJ_COLORS = ['oklch(0.58 0.15 42)','oklch(0.6 0.13 150)','oklch(0.6 0.14 250)','oklch(0.62 0.16 320)','oklch(0.66 0.14 62)','oklch(0.58 0.12 200)'];
  const PRI_RANK = { high:0, med:1, low:2, none:3 };

  // ---- date utils ----
  function isoOf(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
  const todayISO = () => isoOf(new Date());
  function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
  function fmtDate(iso){
    if(!iso) return '';
    const d = parseISO(iso), now = new Date(); now.setHours(0,0,0,0);
    const diff = Math.round((d - now)/86400000);
    if(diff===0) return 'Hari ini';
    if(diff===1) return 'Besok';
    if(diff===-1) return 'Kemarin';
    if(diff>1 && diff<7) return d.toLocaleDateString('id-ID',{weekday:'long'});
    if(diff<-1 && diff>-7) return Math.abs(diff)+' hari lalu';
    return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  }
  function fmtDateFull(iso){ const d=parseISO(iso); return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'}); }
  function dueClass(iso, done){
    if(!iso||done) return '';
    const d=parseISO(iso), now=new Date(); now.setHours(0,0,0,0);
    if(d<now) return 'due-over';
    if(d.getTime()===now.getTime()) return 'due-today';
    return '';
  }

  // ---- state ----
  let state = load();
  let view = { type:'smart', id:'today' };
  let filter = 'all';
  let sortBy = 'manual';
  let search = '';
  let editingId = null;   // null = add mode
  let draftSubs = [];     // subtasks buffer while editing
  let loopMode = 'completion';
  let pendingDelete = null;
  let selectedSwatch = PROJ_COLORS[0];

  function load(){
    try { const raw = localStorage.getItem(LS); if(raw) return JSON.parse(raw); } catch(e){}
    return seed();
  }
  function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }

  function seed(){
    const p1 = uid(), p2 = uid(), p3 = uid();
    const t = (o) => Object.assign({ id:uid(), title:'', done:false, priority:'none', due:null, project:null, tags:[], subtasks:[], notes:'', repeat:null, created:Date.now(), order:0 }, o);
    const plus = n => { const d=new Date(); d.setDate(d.getDate()+n); return isoOf(d); };
    return {
      projects: [
        { id:p1, name:'Pribadi', color:PROJ_COLORS[1] },
        { id:p2, name:'Kerja', color:PROJ_COLORS[2] },
        { id:p3, name:'Belanja', color:PROJ_COLORS[4] },
      ],
      tasks: [
        t({ title:'Nyapu rumah', priority:'low', due:plus(-1), project:p1, tags:['rutin'], repeat:{interval:3,unit:'day',from:'completion'}, order:0 }),
        t({ title:'Review desain aplikasi keuangan', priority:'high', due:plus(0), project:p2, tags:['desain'], order:1,
            subtasks:[{id:uid(),title:'Cek layout dashboard',done:true},{id:uid(),title:'Kumpulin feedback',done:false}] }),
        t({ title:'Bales email klien', priority:'med', due:plus(0), project:p2, order:2 }),
        t({ title:'Olahraga 30 menit', priority:'low', due:plus(0), project:p1, tags:['sehat'], repeat:{interval:1,unit:'day',from:'completion'}, order:3 }),
        t({ title:'Bayar tagihan listrik', priority:'high', due:plus(-2), project:p1, order:4 }),
        t({ title:'Beli kopi & susu', due:plus(2), project:p3, tags:['dapur'], order:5 }),
        t({ title:'Rencanakan liburan akhir bulan', priority:'low', due:plus(6), project:p1, notes:'Cari tiket + penginapan', order:6 }),
        t({ title:'Setor laporan mingguan', priority:'med', due:plus(3), project:p2, tags:['coding'], repeat:{interval:1,unit:'week',from:'schedule'}, order:7 }),
        t({ title:'Baca 20 halaman buku', done:true, project:p1, tags:['sehat'], order:8 }),
      ]
    };
  }

  function icons(){ if(window.lucide) window.lucide.createIcons(); }

  // ---- REPEAT ----
  function unitID(u){ return {day:'hari',week:'minggu',month:'bulan'}[u]||'hari'; }
  function repeatLabel(r){
    if(!r) return '';
    const u=unitID(r.unit);
    return r.interval===1 ? `tiap ${u}` : `tiap ${r.interval} ${u}`;
  }
  function stepDate(d, r){
    if(r.unit==='day') d.setDate(d.getDate()+r.interval);
    else if(r.unit==='week') d.setDate(d.getDate()+r.interval*7);
    else if(r.unit==='month') d.setMonth(d.getMonth()+r.interval);
  }
  function advanceRepeat(t){
    const r=t.repeat; if(!r) return;
    const today=new Date(); today.setHours(0,0,0,0);
    let base;
    if(r.from==='schedule' && t.due){
      base=parseISO(t.due);
      do { stepDate(base, r); } while(base<=today);
    } else {
      base=new Date(today); stepDate(base, r);
    }
    t.due=isoOf(base);
    t.subtasks.forEach(s=>s.done=false);
    t.done=false;
  }
  // hitung preview tanggal berikutnya untuk form
  function previewNext(r, dueIso){
    const today=new Date(); today.setHours(0,0,0,0);
    let base;
    if(r.from==='schedule' && dueIso){ base=parseISO(dueIso); do{ stepDate(base,r);}while(base<=today); }
    else { base=new Date(today); stepDate(base,r); }
    return isoOf(base);
  }

  // ---- SMART LISTS ----
  const startOfToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
  const SMART = [
    { id:'today', name:'Hari Ini', icon:'sun', match:(t)=> (!t.done && t.due && parseISO(t.due) <= startOfToday()) || (t.due===todayISO()) },
    { id:'upcoming', name:'Akan Datang', icon:'calendar-clock', match:(t)=> t.due && parseISO(t.due) > startOfToday() },
    { id:'all', name:'Semua Tugas', icon:'inbox', match:()=> true },
    { id:'flagged', name:'Prioritas', icon:'flag', match:(t)=> t.priority==='high' || t.priority==='med' },
    { id:'recurring', name:'Berulang', icon:'repeat', match:(t)=> !!t.repeat },
    { id:'completed', name:'Selesai', icon:'check-circle-2', match:(t)=> t.done },
  ];

  function tasksForView(){
    let list = state.tasks.slice();
    if(view.type==='smart'){ const s=SMART.find(x=>x.id===view.id); list=list.filter(s.match); }
    else { list = list.filter(t=> t.project===view.id); }
    return list;
  }
  function applyFilterSort(list){
    if(view.id!=='completed'){
      if(filter==='active') list=list.filter(t=>!t.done);
      else if(filter==='done') list=list.filter(t=>t.done);
    }
    if(search){
      const q=search.toLowerCase();
      list=list.filter(t=> t.title.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q) || t.tags.some(tg=>tg.toLowerCase().includes(q)));
    }
    const s=sortBy;
    list.sort((a,b)=>{
      if(s==='manual') return (a.order||0)-(b.order||0);
      if(s==='due'){ if(!a.due) return 1; if(!b.due) return -1; return a.due.localeCompare(b.due); }
      if(s==='priority') return PRI_RANK[a.priority]-PRI_RANK[b.priority];
      if(s==='created') return b.created-a.created;
      if(s==='alpha') return a.title.localeCompare(b.title);
      return 0;
    });
    return list;
  }

  // ---- SIDEBAR ----
  function renderSide(){
    const sn=$('#smartNav'); sn.innerHTML='';
    SMART.forEach(s=>{
      const count=state.tasks.filter(t=> s.match(t) && (s.id==='completed'?true:!t.done)).length;
      const b=document.createElement('button'); b.type='button';
      b.className='nav-item'+(view.type==='smart'&&view.id===s.id?' active':'');
      b.innerHTML=`<i data-lucide="${s.icon}" class="ico"></i><span class="label">${s.name}</span><span class="count">${count||''}</span>`;
      b.onclick=()=>{ view={type:'smart',id:s.id}; filter='all'; syncFilterSeg(); closeDrawer(); render(); };
      sn.appendChild(b);
    });
    const pn=$('#projNav'); pn.innerHTML='';
    state.projects.forEach(p=>{
      const count=state.tasks.filter(t=> t.project===p.id && !t.done).length;
      const b=document.createElement('button'); b.type='button';
      b.className='nav-item'+(view.type==='proj'&&view.id===p.id?' active':'');
      b.innerHTML=`<span class="proj-dot" style="background:${p.color}"></span><span class="label">${esc(p.name)}</span><span class="count">${count||''}</span><span class="proj-del" title="Hapus proyek"><i data-lucide="x" style="width:14px;height:14px"></i></span>`;
      b.onclick=(e)=>{ if(e.target.closest('.proj-del')){ delProject(p.id); return; } view={type:'proj',id:p.id}; filter='all'; syncFilterSeg(); closeDrawer(); render(); };
      pn.appendChild(b);
    });
    icons();
  }
  function delProject(id){
    const p=state.projects.find(x=>x.id===id);
    if(!confirm(`Hapus proyek "${p.name}"? Tugas di dalamnya jadi tanpa proyek.`)) return;
    state.projects=state.projects.filter(x=>x.id!==id);
    state.tasks.forEach(t=>{ if(t.project===id) t.project=null; });
    if(view.type==='proj'&&view.id===id) view={type:'smart',id:'today'};
    save(); fillProjSelects(); render();
  }

  // ---- RENDER MAIN ----
  function render(){
    let title='';
    if(view.type==='smart'){ title=SMART.find(x=>x.id===view.id).name; }
    else { const p=state.projects.find(x=>x.id===view.id); title=p?p.name:'Proyek'; }
    $('#viewTitle').textContent=title;
    $('#viewDate').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    renderSide();

    let list=applyFilterSort(tasksForView());
    const scroll=$('#scroll'); scroll.innerHTML='';

    const base=tasksForView();
    const doneN=base.filter(t=>t.done).length;
    const pct=base.length?doneN/base.length:0;
    $('#ring').style.setProperty('--pct',pct.toFixed(3));
    $('#progNum').textContent=Math.round(pct*100)+'%';
    $('#progLbl').textContent=`${doneN}/${base.length} selesai`;

    if(list.length===0){ scroll.appendChild(emptyState()); icons(); bindEmptyCta(); return; }

    const useGroups= sortBy==='due' || view.id==='today' || view.id==='upcoming' || view.id==='all';
    if(view.type==='proj' || !useGroups){
      const act=list.filter(t=>!t.done), dn=list.filter(t=>t.done);
      act.forEach((t,i)=>scroll.appendChild(taskEl(t,i)));
      if(dn.length){ scroll.appendChild(groupHead('Selesai',dn.length,false)); dn.forEach((t,i)=>scroll.appendChild(taskEl(t,i+act.length))); }
    } else { groupByDate(list, scroll); }
    icons(); enableDnD();
  }

  function groupByDate(list, scroll){
    const now=startOfToday();
    const b={overdue:[],today:[],soon:[],later:[],nodate:[],done:[]};
    list.forEach(t=>{
      if(t.done){ b.done.push(t); return; }
      if(!t.due){ b.nodate.push(t); return; }
      const diff=Math.round((parseISO(t.due)-now)/86400000);
      if(diff<0) b.overdue.push(t); else if(diff===0) b.today.push(t); else if(diff<=7) b.soon.push(t); else b.later.push(t);
    });
    const defs=[['overdue','Terlewat',true],['today','Hari Ini',false],['soon','7 Hari ke Depan',false],['later','Nanti',false],['nodate','Tanpa Tenggat',false],['done','Selesai',false]];
    let idx=0;
    defs.forEach(([k,label,over])=>{ if(b[k].length){ scroll.appendChild(groupHead(label,b[k].length,over)); b[k].forEach(t=>scroll.appendChild(taskEl(t,idx++))); } });
  }
  function groupHead(label,n,over){ const el=document.createElement('div'); el.className='group-head'+(over?' overdue':''); el.innerHTML=`<span>${label}</span><span class="gcount">${n}</span><span class="line"></span>`; return el; }

  function taskEl(t,i){
    const el=document.createElement('div');
    el.className='task'+(t.done?' done':''); el.dataset.id=t.id;
    el.style.animationDelay=Math.min(i,12)*22+'ms'; el.draggable=false;
    let checkCls=t.priority==='high'?'pri-hi':t.priority==='med'?'pri-md':'';
    if(t.repeat) checkCls+=' is-loop';
    const proj=state.projects.find(p=>p.id===t.project);
    const dc=dueClass(t.due,t.done);
    const subDone=t.subtasks.filter(s=>s.done).length;
    let meta='';
    if(t.due){ const ico=dc==='due-over'?'alert-circle':'calendar'; meta+=`<span class="badge ${dc}"><i data-lucide="${ico}" class="ico"></i>${fmtDate(t.due)}</span>`; }
    if(t.repeat) meta+=`<span class="badge loop"><i data-lucide="repeat" class="ico"></i>${repeatLabel(t.repeat)}</span>`;
    if(t.priority!=='none'){ const m={high:['hi','Tinggi'],med:['md','Sedang'],low:['lo','Rendah']}; meta+=`<span class="badge pri ${m[t.priority][0]}">${m[t.priority][1]}</span>`; }
    if(proj) meta+=`<span class="badge proj"><span class="proj-dot" style="background:${proj.color}"></span>${esc(proj.name)}</span>`;
    if(t.subtasks.length) meta+=`<span class="badge sub"><i data-lucide="list-checks" class="ico"></i>${subDone}/${t.subtasks.length}</span>`;
    if(t.notes) meta+=`<span class="badge"><i data-lucide="align-left" class="ico"></i></span>`;
    t.tags.forEach(tg=> meta+=`<span class="badge tag">#${esc(tg)}</span>`);
    el.innerHTML=`
      <span class="drag-h" title="Geser untuk urutkan"><i data-lucide="grip-vertical" style="width:16px;height:16px"></i></span>
      <button class="check ${checkCls}" type="button" aria-label="Tandai selesai"><i data-lucide="check"></i></button>
      <div class="t-body"><div class="t-title">${esc(t.title)}</div><div class="t-meta">${meta}</div></div>
      <div class="t-actions">
        <button class="edit" type="button" title="Detail"><i data-lucide="pencil" style="width:16px;height:16px"></i></button>
        <button class="del" type="button" title="Hapus"><i data-lucide="trash-2" style="width:16px;height:16px"></i></button>
      </div>`;
    el.querySelector('.check').onclick=(e)=>{ e.stopPropagation(); toggleDone(t.id,el); };
    el.querySelector('.t-body').onclick=()=>openEdit(t.id);
    el.querySelector('.edit').onclick=(e)=>{ e.stopPropagation(); openEdit(t.id); };
    el.querySelector('.del').onclick=(e)=>{ e.stopPropagation(); deleteTask(t.id); };
    const h=el.querySelector('.drag-h');
    h.addEventListener('mousedown',()=>el.draggable=true);
    h.addEventListener('touchstart',()=>el.draggable=true,{passive:true});
    el.addEventListener('dragend',()=>el.draggable=false);
    return el;
  }

  function emptyState(){
    const el=document.createElement('div'); el.className='empty';
    let icon='check-check',h='Semua beres!',p='Tidak ada tugas di sini. Nikmati waktu luangmu.',cta=true;
    if(search){ icon='search-x'; h='Nggak ketemu'; p=`Nggak ada tugas yang cocok dengan "${esc(search)}".`; cta=false; }
    else if(view.id==='today'){ icon='sun'; h='Hari ini santai'; p='Belum ada tugas untuk hari ini.'; }
    else if(view.id==='recurring'){ icon='repeat'; h='Belum ada tugas berulang'; p='Nyalakan "Ulangi tugas" saat menambah tugas baru.'; }
    else if(view.id==='completed'){ icon='check-circle-2'; h='Belum ada yang selesai'; p='Tugas yang kamu tandai selesai muncul di sini.'; cta=false; }
    else if(filter==='done'){ icon='circle-dashed'; h='Belum ada yang selesai'; p='Selesaikan tugas untuk melihatnya di sini.'; cta=false; }
    el.innerHTML=`<div class="empty-art"><i data-lucide="${icon}" style="width:34px;height:34px"></i></div><h3>${h}</h3><p>${p}</p>${cta?'<button class="empty-cta" id="emptyCta" type="button"><i data-lucide="plus" style="width:16px;height:16px"></i>Tambah tugas</button>':''}`;
    return el;
  }
  function bindEmptyCta(){ const b=$('#emptyCta'); if(b) b.onclick=()=>openAdd(); }

  // ---- MUTATIONS ----
  function toggleDone(id,el){
    const t=state.tasks.find(x=>x.id===id); if(!t) return;
    if(t.repeat && !t.done){
      const prevDue=t.due, prevSubs=t.subtasks.map(s=>s.done);
      advanceRepeat(t); save(); renderSide();
      if(el) el.classList.add('looping');
      setTimeout(render,220);
      toast(`Diulang. Berikutnya: ${fmtDate(t.due)}`,'Urungkan',()=>{ t.due=prevDue; t.subtasks.forEach((s,i)=>s.done=prevSubs[i]); t.done=false; save(); render(); });
      return;
    }
    t.done=!t.done; save(); setTimeout(render, t.done?180:0); renderSide();
    if(el) el.classList.toggle('done',t.done);
  }
  function deleteTask(id){
    const idx=state.tasks.findIndex(x=>x.id===id); if(idx<0) return;
    const [removed]=state.tasks.splice(idx,1);
    pendingDelete={task:removed,idx}; save(); render();
    toast(`"${trunc(removed.title,28)}" dihapus`,'Urungkan',()=>{ state.tasks.splice(Math.min(pendingDelete.idx,state.tasks.length),0,pendingDelete.task); pendingDelete=null; save(); render(); });
  }
  function projName(id){ const p=state.projects.find(x=>x.id===id); return p?p.name:'Semua Tugas'; }

  // ============ TASK MODAL (add + edit) ============
  function resetLoopUI(){
    $('#tLoopOn').checked=false;
    $('#loopPanel').classList.add('hide');
    $('#tLoopInt').value=3; $('#tLoopUnit').value='day';
    setLoopMode('completion');
  }
  function setLoopMode(m){
    loopMode=m;
    $('#modeCompletion').classList.toggle('sel',m==='completion');
    $('#modeSchedule').classList.toggle('sel',m==='schedule');
    updateLoopPreview();
  }
  function updateLoopPreview(){
    if(!$('#tLoopOn').checked) return;
    const r={ interval:clampInt($('#tLoopInt').value), unit:$('#tLoopUnit').value, from:loopMode };
    const dueIso=$('#tDate').value || todayISO();
    const next=previewNext(r, dueIso);
    const span=$('#loopPreview').querySelector('span');
    if(loopMode==='completion'){
      span.textContent=`Dihitung dari tanggal kamu menyelesaikan. Kalau selesai hari ini, berikutnya jatuh ${fmtDateFull(next)}. Telat selesai = jadwal geser ikut mundur.`;
    } else {
      span.textContent=`Dikunci ke jadwal. Dari tenggat ${dueIso?fmtDateFull(dueIso):'yang diisi'}, berikutnya ${fmtDateFull(next)}, berapa pun kamu telat menyelesaikan.`;
    }
  }
  function clampInt(v){ let n=parseInt(v,10); if(isNaN(n)||n<1) n=1; if(n>999) n=999; return n; }

  function openAdd(){
    editingId=null; draftSubs=[];
    $('#tModalTitle').textContent='Tugas Baru';
    $('#tSaveLbl').textContent='Buat Tugas';
    $('#tCheck').style.display='none';
    $('#tDel').style.visibility='hidden';
    $('#subsSection').style.display='none';
    $('#tTitle').value='';
    $('#tPri').value='none';
    // default tanggal: kalau di view Hari Ini -> hari ini
    $('#tDate').value = (view.id==='today') ? todayISO() : '';
    $('#tProj').value = (view.type==='proj') ? view.id : '';
    $('#tTags').value='';
    $('#tNotes').value='';
    resetLoopUI();
    $('#taskModal').showModal(); icons();
    setTimeout(()=>$('#tTitle').focus(),60);
  }

  function openEdit(id){
    const t=state.tasks.find(x=>x.id===id); if(!t) return;
    editingId=id; draftSubs=t.subtasks.map(s=>({...s}));
    $('#tModalTitle').textContent='Edit Tugas';
    $('#tSaveLbl').textContent='Simpan';
    const chk=$('#tCheck'); chk.style.display='grid'; chk.classList.toggle('done',t.done);
    $('#tDel').style.visibility='visible';
    $('#tTitle').value=t.title;
    $('#tPri').value=t.priority;
    $('#tDate').value=t.due||'';
    $('#tProj').value=t.project||'';
    $('#tTags').value=t.tags.join(', ');
    $('#tNotes').value=t.notes||'';
    if(t.repeat){
      $('#tLoopOn').checked=true; $('#loopPanel').classList.remove('hide');
      $('#tLoopInt').value=t.repeat.interval; $('#tLoopUnit').value=t.repeat.unit;
      setLoopMode(t.repeat.from||'completion');
    } else { resetLoopUI(); }
    $('#subsSection').style.display='block';
    renderDraftSubs();
    $('#taskModal').showModal(); icons();
    setTimeout(()=>$('#tTitle').focus(),60);
  }

  function readLoop(){
    if(!$('#tLoopOn').checked) return null;
    return { interval:clampInt($('#tLoopInt').value), unit:$('#tLoopUnit').value, from:loopMode };
  }

  function saveTask(){
    const title=$('#tTitle').value.trim();
    if(!title){ $('#tTitle').focus(); toast('Judul tugas belum diisi','',null); return; }
    const pri=$('#tPri').value;
    let due=$('#tDate').value||null;
    let proj=$('#tProj').value||null;
    const tags=$('#tTags').value.split(',').map(s=>s.trim()).filter(Boolean);
    const notes=$('#tNotes').value.trim();
    const repeat=readLoop();
    if(repeat && !due) due=todayISO(); // tugas berulang butuh tanggal acuan

    if(editingId){
      const t=state.tasks.find(x=>x.id===editingId);
      Object.assign(t,{ title, priority:pri, due, project:proj, tags, notes, repeat, subtasks:draftSubs });
      t.done=$('#tCheck').classList.contains('done');
      save(); $('#taskModal').close(); render();
      toast('Perubahan disimpan','',null);
    } else {
      const nt={ id:uid(), title, done:false, priority:pri, due, project:proj, tags, subtasks:draftSubs, notes, repeat, created:Date.now(), order:-1 };
      state.tasks.unshift(nt); state.tasks.forEach((t,i)=>t.order=i);
      save(); $('#taskModal').close();
      const visible=new Set(applyFilterSort(tasksForView()).map(x=>x.id));
      if(!visible.has(nt.id)){
        view= nt.project?{type:'proj',id:nt.project}:{type:'smart',id:'all'};
        filter='all'; syncFilterSeg();
        toast('Ditambahkan ke '+(nt.project?projName(nt.project):'Semua Tugas'),'',null);
      } else { toast('Tugas ditambahkan','',null); }
      render();
    }
  }

  function renderDraftSubs(){
    const sl=$('#subList'); sl.innerHTML='';
    const done=draftSubs.filter(s=>s.done).length;
    $('#subsBar').style.width=(draftSubs.length?done/draftSubs.length*100:0)+'%';
    $('#subsCount').textContent=draftSubs.length?`${done}/${draftSubs.length}`:'';
    draftSubs.forEach(s=>{
      const el=document.createElement('div'); el.className='sub-item'+(s.done?' done':'');
      el.innerHTML=`<button class="sub-check" type="button"><i data-lucide="check"></i></button><input type="text" value="${esc(s.title)}"><button class="sub-del" type="button"><i data-lucide="x" style="width:14px;height:14px"></i></button>`;
      el.querySelector('.sub-check').onclick=()=>{ s.done=!s.done; renderDraftSubs(); };
      el.querySelector('input').onchange=(e)=>{ s.title=e.target.value; };
      el.querySelector('.sub-del').onclick=()=>{ draftSubs=draftSubs.filter(x=>x.id!==s.id); renderDraftSubs(); };
      sl.appendChild(el);
    });
    icons();
  }

  function bindTaskModal(){
    $('#sideAddBtn').onclick=openAdd;
    $('#topAddBtn').onclick=openAdd;
    $('#tClose').onclick=()=>$('#taskModal').close();
    $('#tCancel').onclick=()=>$('#taskModal').close();
    $('#tSave').onclick=saveTask;
    $('#tDel').onclick=()=>{ const id=editingId; $('#taskModal').close(); if(id) deleteTask(id); };
    $('#tCheck').onclick=()=>{ $('#tCheck').classList.toggle('done'); };
    $('#taskModal').addEventListener('click',(e)=>{ if(e.target===$('#taskModal')) $('#taskModal').close(); });

    // Enter di judul = simpan (kecuali sedang di textarea/subtask)
    $('#tTitle').addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); saveTask(); } });

    // loop toggle
    $('#tLoopOn').addEventListener('change',()=>{
      const on=$('#tLoopOn').checked;
      $('#loopPanel').classList.toggle('hide',!on);
      if(on) updateLoopPreview();
    });
    $('#loopMinus').onclick=()=>{ $('#tLoopInt').value=clampInt(+$('#tLoopInt').value-1); updateLoopPreview(); };
    $('#loopPlus').onclick=()=>{ $('#tLoopInt').value=clampInt(+$('#tLoopInt').value+1); updateLoopPreview(); };
    $('#tLoopInt').addEventListener('input',updateLoopPreview);
    $('#tLoopInt').addEventListener('blur',()=>{ $('#tLoopInt').value=clampInt($('#tLoopInt').value); updateLoopPreview(); });
    $('#tLoopUnit').addEventListener('change',updateLoopPreview);
    $('#tDate').addEventListener('change',updateLoopPreview);
    $('#modeCompletion').onclick=()=>setLoopMode('completion');
    $('#modeSchedule').onclick=()=>setLoopMode('schedule');

    // subtasks (edit mode)
    $('#subInput').addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){ const v=e.target.value.trim(); if(!v) return; draftSubs.push({id:uid(),title:v,done:false}); e.target.value=''; renderDraftSubs(); }
    });
  }

  // ---- PROJECT MODAL ----
  function bindProjModal(){
    const sw=$('#swatches');
    PROJ_COLORS.forEach((c,i)=>{
      const b=document.createElement('button'); b.type='button';
      b.className='swatch'+(i===0?' sel':''); b.style.background=c;
      b.onclick=()=>{ selectedSwatch=c; sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
      sw.appendChild(b);
    });
    $('#addProjBtn').onclick=()=>{ $('#projName').value=''; selectedSwatch=PROJ_COLORS[0]; sw.querySelectorAll('.swatch').forEach((x,i)=>x.classList.toggle('sel',i===0)); $('#projModal').showModal(); setTimeout(()=>$('#projName').focus(),50); };
    $('#projCancel').onclick=()=>$('#projModal').close();
    $('#projSave').onclick=saveProj;
    $('#projName').addEventListener('keydown',(e)=>{ if(e.key==='Enter') saveProj(); });
    $('#projModal').addEventListener('click',(e)=>{ if(e.target===$('#projModal')) $('#projModal').close(); });
  }
  function saveProj(){
    const name=$('#projName').value.trim(); if(!name) return;
    const p={id:uid(),name,color:selectedSwatch};
    state.projects.push(p); save(); fillProjSelects();
    $('#projModal').close(); view={type:'proj',id:p.id}; render();
  }
  function fillProjSelects(){
    ['#tProj'].forEach(sel=>{
      const el=$(sel); const cur=el.value;
      el.innerHTML='<option value="">Tanpa proyek</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
      el.value=cur;
    });
  }

  // ---- DRAG & DROP ----
  let dragEl=null;
  function enableDnD(){
    const scroll=$('#scroll');
    scroll.querySelectorAll('.task').forEach(el=>{
      el.addEventListener('dragstart',(e)=>{ dragEl=el; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
      el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); scroll.querySelectorAll('.task').forEach(t=>t.classList.remove('drop-above','drop-below')); dragEl=null; commitOrder(); });
      el.addEventListener('dragover',(e)=>{ e.preventDefault(); if(!dragEl||dragEl===el) return; const r=el.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2; scroll.querySelectorAll('.task').forEach(t=>t.classList.remove('drop-above','drop-below')); el.classList.add(after?'drop-below':'drop-above'); });
      el.addEventListener('drop',(e)=>{ e.preventDefault(); if(!dragEl||dragEl===el) return; const r=el.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2; if(after) el.after(dragEl); else el.before(dragEl); });
    });
  }
  function commitOrder(){
    if(sortBy!=='manual'){ toast('Ubah urutan ke "Manual" biar susunannya kesimpen','',null); render(); return; }
    const ids=[...$('#scroll').querySelectorAll('.task')].map(el=>el.dataset.id);
    ids.forEach((id,i)=>{ const t=state.tasks.find(x=>x.id===id); if(t) t.order=i; });
    let n=ids.length; state.tasks.forEach(t=>{ if(!ids.includes(t.id)) t.order=n++; });
    save();
  }

  // ---- TOAST ----
  let toastT=null;
  function toast(msg,actionLabel,action){
    const wrap=$('#toastWrap'); wrap.innerHTML='';
    const el=document.createElement('div'); el.className='toast'; el.innerHTML=`<span>${msg}</span>`;
    if(actionLabel){ const b=document.createElement('button'); b.type='button'; b.textContent=actionLabel; b.onclick=()=>{ action&&action(); wrap.innerHTML=''; clearTimeout(toastT); }; el.appendChild(b); }
    wrap.appendChild(el); icons();
    clearTimeout(toastT); toastT=setTimeout(()=>{ wrap.innerHTML=''; pendingDelete=null; },5000);
  }

  // ---- helpers ----
  function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function trunc(s,n){ return s.length>n?s.slice(0,n)+'…':s; }

  // ---- CONTROLS ----
  function syncFilterSeg(){ $('#filterSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter)); }
  function bindControls(){
    $('#filterSeg').querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ filter=b.dataset.filter; syncFilterSeg(); render(); }; });
    $('#sortSel').onchange=(e)=>{ sortBy=e.target.value; render(); };
    const si=$('#searchInput'), sb=$('#searchBox');
    si.addEventListener('input',()=>{ search=si.value.trim(); sb.classList.toggle('has-val',!!si.value); render(); });
    $('#searchClr').onclick=()=>{ si.value=''; search=''; sb.classList.remove('has-val'); render(); si.focus(); };
    $('#menuBtn').onclick=()=>{ $('#side').classList.add('open'); $('#scrim').classList.add('on'); };
    $('#scrim').onclick=closeDrawer;
    document.addEventListener('keydown',(e)=>{
      const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
      const anyModal=$('#taskModal').open||$('#projModal').open;
      if(e.key==='/'&&!typing&&!anyModal){ e.preventDefault(); si.focus(); }
      if((e.key==='n'||e.key==='N')&&!typing&&!anyModal){ e.preventDefault(); openAdd(); }
    });
  }
  function closeDrawer(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }

  // ---- INIT ----
  function init(){
    fillProjSelects();
    bindControls(); bindTaskModal(); bindProjModal();
    render(); icons();
  }
  init();
})();
</script>
</body>
</html>
